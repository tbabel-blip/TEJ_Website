<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TEJ Holdings</title>
  <link rel="icon" type="image/png" href="assets/Tej_Innovations_logo_only.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #E87722;
      --orange-dark: #C95F0A;
      --orange-light: #FFF0E0;
      --white: #FFFFFF;
      --off-white: #F7F7F5;
      --dark: #1A1A1A;
      --mid: #4A4A4A;
      --muted: #888;
      --border: #E0DDD8;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--off-white);
      color: var(--dark);
      min-height: 100vh;
    }

    /* HEADER */
    .site-header {
      background: var(--dark);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 48px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      text-decoration: none;
    }
    .brand-name {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .brand-name span { color: var(--orange); }
    .brand-sub {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.45);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .header-contact {
      font-size: 18px;
      font-weight: 700;
      color: var(--orange);
      text-decoration: none;
      letter-spacing: 0.5px;
    }
    .header-contact:hover { color: #ffaa55; }

    /* NAV */
    .site-nav {
      display: flex;
      padding: 0 48px;
      gap: 0;
    }
    .nav-tab {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      padding: 14px 22px;
      border-bottom: 3px solid transparent;
      transition: color 0.2s, border-color 0.2s;
    }
    .nav-tab:hover { color: var(--white); }
    .nav-tab.active { color: var(--orange); border-bottom-color: var(--orange); }

    /* PAGE WRAPPER */
    .page { max-width: 1100px; margin: 0 auto; padding: 52px 32px 80px; }

    /* SECTION TITLE */
    .section-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--dark);
      margin-bottom: 8px;
    }
    .section-subtitle {
      font-size: 15px;
      color: var(--muted);
      margin-bottom: 40px;
    }

    /* PROPERTY GRID */
    .property-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }
    @media (max-width: 800px) {
      .property-grid { grid-template-columns: repeat(2, 1fr); }
      .header-top { padding: 14px 20px; }
      .site-nav { padding: 0 8px; }
    }
    @media (max-width: 520px) {
      .property-grid { grid-template-columns: 1fr; }
      .nav-tab { padding: 12px 10px; font-size: 11px; }
    }

    /* PROPERTY CARD */
    .property-card {
      cursor: pointer;
      border: none;
      background: none;
      padding: 0;
      text-align: left;
      display: block;
      width: 100%;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .property-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,0.18); }
    .property-card img {
      width: 100%;
      aspect-ratio: 4/3;
      object-fit: cover;
      display: block;
    }
    .property-card-label {
      background: var(--orange);
      padding: 12px 16px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1.2;
    }
    .property-card-label .city {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.75);
      display: block;
      margin-top: 2px;
    }

    /* DETAIL PAGE */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Barlow', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--orange);
      padding: 0;
      margin-bottom: 32px;
    }
    .back-btn:hover { color: var(--orange-dark); }

    .detail-hero {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      margin-bottom: 48px;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    }
    .detail-hero img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }
    .detail-hero img.full-width {
      grid-column: 1 / -1;
      height: 400px;
    }

    .detail-header {
      margin-bottom: 40px;
    }
    .detail-address {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 38px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.1;
      color: var(--dark);
      margin-bottom: 6px;
    }
    .detail-city {
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .detail-body {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 48px;
      align-items: start;
    }
    @media (max-width: 720px) {
      .detail-body { grid-template-columns: 1fr; }
      .detail-hero { grid-template-columns: 1fr; }
      .detail-hero img { height: 220px; }
      .detail-hero img.full-width { height: 260px; }
      .detail-address { font-size: 28px; }
    }

    .detail-section { margin-bottom: 36px; }
    .detail-section h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--orange-light);
    }
    .detail-section p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--mid);
      text-wrap: pretty;
    }

    .detail-sidebar {}
    .sidebar-card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 20px;
      margin-bottom: 16px;
    }
    .sidebar-card h4 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .sidebar-pill {
      display: inline-block;
      background: var(--orange);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 2px;
      margin: 3px 4px 3px 0;
    }
    .sidebar-pill.vacant { background: #555; }
    .sidebar-pill.available { background: #2E7D32; }

    /* BILLBOARD PAGE */
    .billboard-hero {
      position: relative;
      height: 380px;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 56px;
      box-shadow: 0 4px 28px rgba(0,0,0,0.18);
    }
    .billboard-hero img { width: 100%; height: 100%; object-fit: cover; }
    .billboard-hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to right, rgba(20,20,20,0.88) 40%, rgba(20,20,20,0.2));
      display: flex;
      align-items: center;
      padding: 48px;
    }
    .billboard-hero-text h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 52px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--white);
      line-height: 1;
      margin-bottom: 12px;
    }
    .billboard-hero-text h2 span { color: var(--orange); }
    .billboard-hero-text p { font-size: 16px; color: rgba(255,255,255,0.7); max-width: 420px; line-height: 1.6; }

    .billboard-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
      margin-bottom: 48px;
    }
    @media (max-width: 720px) { .billboard-content { grid-template-columns: 1fr; } }
    .billboard-block h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dark);
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 3px solid var(--orange);
      display: inline-block;
    }
    .billboard-block p { font-size: 15px; line-height: 1.7; color: var(--mid); margin-top: 14px; text-wrap: pretty; }

    .process-steps {
      display: flex;
      gap: 0;
      margin: 48px 0;
      background: var(--dark);
      border-radius: 4px;
      overflow: hidden;
    }
    .process-step {
      flex: 1;
      padding: 28px 24px;
      border-right: 1px solid rgba(255,255,255,0.08);
      text-align: center;
    }
    .process-step:last-child { border-right: none; }
    .step-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 42px;
      font-weight: 800;
      color: var(--orange);
      line-height: 1;
      margin-bottom: 8px;
    }
    .step-label {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.85);
    }
    .step-desc { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 6px; line-height: 1.5; }
    @media (max-width: 640px) {
      .process-steps { flex-direction: column; }
      .process-step { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
    }

    /* COMING SOON PAGE */
    .coming-intro {
      background: var(--dark);
      border-radius: 4px;
      padding: 40px 48px;
      margin-bottom: 48px;
      color: var(--white);
    }
    .coming-intro h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 12px;
    }
    .coming-intro p { font-size: 15px; line-height: 1.7; color: rgba(255,255,255,0.7); max-width: 700px; }

    .coming-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-bottom: 48px;
    }
    @media (max-width: 720px) { .coming-grid { grid-template-columns: 1fr; } }

    .coming-card {
      cursor: pointer;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .coming-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,0.14); }
    .coming-card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .coming-card-body { padding: 20px; }
    .coming-card-body h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--dark);
      margin-bottom: 4px;
    }
    .coming-card-body p { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .status-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
      margin-bottom: 10px;
    }
    .status-permitting { background: #FFF3CD; color: #8B6914; }
    .status-acquisition { background: #E8F5E9; color: #2E7D32; }
    .status-repositioning { background: #E3F2FD; color: #1565C0; }

    /* BILLBOARD DETAIL */
    .map-embed {
      width: 100%;
      height: 400px;
      border: none;
      border-radius: 4px;
      margin-bottom: 32px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.1);
    }

    .billboard-sites-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 1px 8px rgba(0,0,0,0.07);
      margin-bottom: 32px;
    }
    .billboard-sites-table th {
      background: var(--dark);
      color: rgba(255,255,255,0.85);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 16px;
      text-align: left;
    }
    .billboard-sites-table td { padding: 14px 16px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--mid); }
    .billboard-sites-table tr:last-child td { border-bottom: none; }
    .billboard-sites-table tr:hover td { background: var(--off-white); }

    /* CONTACT PAGE */
    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }
    @media (max-width: 720px) { .contact-grid { grid-template-columns: 1fr; } }

    .contact-info h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--dark);
      margin-bottom: 28px;
    }
    .contact-detail {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      align-items: flex-start;
    }
    .contact-icon {
      width: 40px;
      height: 40px;
      background: var(--orange);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
      color: var(--white);
    }
    .contact-detail-text label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 3px;
    }
    .contact-detail-text p, .contact-detail-text a {
      font-size: 15px;
      font-weight: 500;
      color: var(--dark);
      text-decoration: none;
      line-height: 1.5;
    }
    .contact-detail-text a:hover { color: var(--orange); }

    .contact-form-wrapper {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 32px;
    }
    .contact-form-wrapper h3 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--dark);
      margin-bottom: 24px;
    }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--mid); margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-family: 'Barlow', sans-serif;
      font-size: 15px;
      color: var(--dark);
      background: var(--off-white);
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--orange); background: var(--white); }
    .form-group textarea { resize: vertical; min-height: 120px; }
    .btn-submit {
      width: 100%;
      background: var(--orange);
      color: var(--white);
      border: none;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 15px;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-submit:hover { background: var(--orange-dark); }
    .btn-submit:active { transform: scale(0.98); }
    .form-success {
      background: #E8F5E9;
      border: 1px solid #A5D6A7;
      color: #2E7D32;
      padding: 14px 18px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
    }

    /* HOME PAGE */
    .home-hero {
      background: var(--dark);
      min-height: 520px;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    .home-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url('assets/9889 Halls ferry (main).jpg') center/cover no-repeat;
      opacity: 0.18;
    }
    .home-hero-inner {
      position: relative;
      max-width: 1100px;
      margin: 0 auto;
      padding: 80px 48px;
      width: 100%;
    }
    .home-eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--orange);
      margin-bottom: 18px;
    }
    .home-headline {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(44px, 7vw, 82px);
      font-weight: 800;
      text-transform: uppercase;
      line-height: 0.95;
      color: var(--white);
      margin-bottom: 24px;
      letter-spacing: -1px;
    }
    .home-headline span { color: var(--orange); }
    .home-tagline {
      font-size: 17px;
      color: rgba(255,255,255,0.65);
      max-width: 520px;
      line-height: 1.6;
      margin-bottom: 40px;
    }
    .home-cta-row { display: flex; gap: 14px; flex-wrap: wrap; }
    .btn-primary {
      background: var(--orange);
      color: var(--white);
      border: none;
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px 28px;
      border-radius: 4px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-primary:hover { background: var(--orange-dark); }
    .btn-outline {
      background: transparent;
      color: var(--white);
      border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 12px 28px;
      border-radius: 4px;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-outline:hover { border-color: var(--orange); color: var(--orange); }

    .home-stats {
      background: var(--orange);
      display: flex;
      justify-content: center;
      gap: 0;
    }
    .home-stat {
      flex: 1;
      max-width: 220px;
      padding: 28px 24px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.25);
    }
    .home-stat:last-child { border-right: none; }
    .home-stat-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 46px;
      font-weight: 800;
      color: var(--white);
      line-height: 1;
    }
    .home-stat-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.75);
      margin-top: 4px;
    }

    .home-about {
      max-width: 1100px;
      margin: 0 auto;
      padding: 72px 48px;
      display: grid;
      grid-template-columns: 1.1fr 1fr;
      gap: 64px;
      align-items: center;
    }
    @media (max-width: 800px) {
      .home-about { grid-template-columns: 1fr; padding: 48px 24px; gap: 36px; }
      .home-hero-inner { padding: 60px 24px; }
      .home-stats { flex-wrap: wrap; }
    }
    .home-about-text h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 38px;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--dark);
      margin-bottom: 18px;
      line-height: 1.05;
    }
    .home-about-text h2 span { color: var(--orange); }
    .home-about-text p {
      font-size: 15px;
      line-height: 1.75;
      color: var(--mid);
      margin-bottom: 14px;
      text-wrap: pretty;
    }
    .home-about-image {
      position: relative;
      border-radius: 4px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }

        plan: "Under Tej Innovations' ownership, the plan involves combining existing units and reconfiguring the floor plan to create flexible, purpose-built space capable of accommodating a wide range of mixed-use office and retail tenants. Rather than delivering a fixed layout, the space is being designed to adapt — allowing configuration to be tailored to the specific needs of the right tenant at the time of lease.",
        location: "Oak Park's Lake Street corridor benefits from exceptional regional connectivity, with direct CTA Green Line access, proximity to the Eisenhower Expressway, and strong pedestrian foot traffic from one of the most walkable communities in the greater Chicago area. The submarket attracts a sophisticated tenant base and commands rents reflective of its proximity to the city.",
      }
    ];

    function ComingSoonPage() {
      const [selected, setSelected] = useState(null);
      if (selected) return <ComingSoonDetail item={selected} onBack={() => setSelected(null)} />;
      return (
        <div className="page">
          <h1 className="section-title">Coming Soon</h1>
          <p className="section-subtitle">Active pipeline — click a project to view details.</p>

          <div className="coming-intro">
            <h2>Active Development Pipeline</h2>
            <p>Tej Holdings maintains an active development pipeline spanning both commercial real estate acquisitions and outdoor advertising infrastructure. Projects are currently in progress — properties being repositioned, structures being permitted, and locations being underwritten. As each project moves toward completion, it will be featured in our full portfolio.</p>
          </div>

          <div className="coming-grid">
            {COMING_SOON.map(item => (
              <div key={item.id} className="coming-card" onClick={() => setSelected(item)} role="button" tabIndex={0} onKeyDown={e => e.key === "Enter" && setSelected(item)}>
                {item.image
                  ? <img src={item.image} alt={item.label} />
                  : <div style={{height: 200, background: "#1A1A1A", display:"flex", alignItems:"center", justifyContent:"center"}}>
                      <span style={{fontFamily:"'Barlow Condensed',sans-serif", fontSize:20, fontWeight:800, color:"rgba(255,255,255,0.3)", textTransform:"uppercase", letterSpacing:2}}>Photo Coming Soon</span>
                    </div>
                }
                <div className="coming-card-body">
                  <span className={`status-badge ${item.statusBadge}`}>{item.status}</span>
                  <h3>{item.label}</h3>
                  <p>{item.sublabel}</p>
                  <p style={{marginTop: 8}}>{item.desc}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // ── Contact ──────────────────────────────────────────────────────────────

    function ContactPage() {
      const [submitted, setSubmitted] = useState(false);

      const handleSubmit = (e) => {
        e.preventDefault();
        const form = e.target;
        const data = new FormData(form);
        fetch("/", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams(data).toString(),
        })
          .then(() => setSubmitted(true))
          .catch(() => setSubmitted(true)); // still show success, Netlify usually catches it
      };

      return (
        <div className="page">
          <h1 className="section-title">Contact Us</h1>
          <p className="section-subtitle">Reach out with acquisition inquiries, leasing questions, or partnership opportunities.</p>

          <div className="contact-grid">
            <div className="contact-info">
              <h2>Get in Touch</h2>
              <div className="contact-detail">
                <div className="contact-icon">✆</div>
                <div className="contact-detail-text">
                  <label>Phone</label>
                  <a href="tel:2622716190">262-271-6190</a>
                </div>
              </div>
              <div className="contact-detail">
                <div className="contact-icon">@</div>
                <div className="contact-detail-text">
                  <label>Email</label>
                  <a href="mailto:tejas.babel@gmail.com">tejas.babel@gmail.com</a>
                </div>
              </div>
              <div className="contact-detail">
                <div className="contact-icon">✉</div>
                <div className="contact-detail-text">
                  <label>Mailing Address</label>
                  <p>4718 Dale St<br />McFarland, WI</p>
                </div>
              </div>
              <div className="contact-detail">
                <div className="contact-icon">⌂</div>
                <div className="contact-detail-text">
                  <label>Office Address</label>
                  <p>321 E 3rd St N<br />Newton, IA 50208</p>
                </div>
              </div>
            </div>

            <div className="contact-form-wrapper">
              <h3>Send a Message</h3>
              {submitted ? (
                <div className="form-success">
                  <strong>Message received!</strong> We'll get back to you shortly.
                </div>
              ) : (
                <form
                  name="contact"
                  method="POST"
                  data-netlify="true"
                  netlify-honeypot="bot-field"
                  onSubmit={handleSubmit}
                >
                  <input type="hidden" name="form-name" value="contact" />
                  <p style={{display:"none"}}><label>Don't fill this out: <input name="bot-field" /></label></p>
                  <div className="form-group">
                    <label htmlFor="contact-name">Your Name</label>
                    <input id="contact-name" type="text" name="name" required placeholder="John Smith" />
                  </div>
                  <div className="form-group">
                    <label htmlFor="contact-email">Email Address</label>
                    <input id="contact-email" type="email" name="email" required placeholder="john@example.com" />
                  </div>
                  <div className="form-group">
                    <label htmlFor="contact-phone">Phone (optional)</label>
                    <input id="contact-phone" type="tel" name="phone" placeholder="555-000-0000" />
                  </div>
                  <div className="form-group">
                    <label htmlFor="contact-message">Message</label>
                    <textarea id="contact-message" name="message" required placeholder="Tell us about your inquiry..." />
                  </div>
                  <button type="submit" className="btn-submit">Send Message</button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ── App ──────────────────────────────────────────────────────────────────

    function App() {
      const [tab, setTab] = useState("home");

      return (
        <>
          <Header tab={tab} setTab={setTab} />
          {tab === "home" && <HomePage setTab={setTab} />}
          {tab === "real-estate" && <RealEstatePage />}
          {tab === "billboard" && <BillboardPage />}
          {tab === "coming-soon" && <ComingSoonPage />}
          {tab === "contact" && <ContactPage />}
          <footer className="site-footer">
            © 2026 <span>TEJ Innovations</span>. All rights reserved.
          </footer>
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
